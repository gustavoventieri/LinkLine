<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div
      style="
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: auto;
        padding: 24px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #ffffff;
      "
    >
      <div style="text-align: center; margin-bottom: 24px">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Chat_emoji_icon.png"
          alt="LinkLine Logo"
          style="max-width: 100px"
        />
      </div>

      <h2 style="color: #3b82f6; text-align: center; margin-bottom: 16px">
        Redefinição de Senha
      </h2>

      <p style="color: #333333; text-align: center">
        <strong>Seu código de redefinição de senha é:</strong>
      </p>

      <div style="text-align: center; margin: 24px 0">
        <span
          style="
            font-size: 28px;
            font-weight: bold;
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            display: inline-block;
            border-radius: 8px;
          "
          th:text="${code}"
          >123456</span
        >
      </div>

      <p style="color: #333333; text-align: center">
        Este código expira em 1 hora por motivos de segurança.
      </p>

      <hr style="margin: 32px 0; border: none; border-top: 1px solid #eee" />

      <p style="color: #333333; text-align: center">
        Caso você não tenha solicitado a redefinição de senha, ignore este
        e-mail.
      </p>

      <p style="color: #333333; text-align: center">Atenciosamente,</p>
      <p style="color: #333333; text-align: center">
        <strong>Equipe LinkLine</strong><br />
        <a
          href="https://linkline.chat"
          style="color: #3b82f6; text-decoration: none"
          target="_blank"
          >linkline.chat</a
        >
      </p>
    </div>
  </body>
</html>
