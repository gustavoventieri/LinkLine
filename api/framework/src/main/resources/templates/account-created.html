<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div
      style="
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: auto;
        padding: 24px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #ffffff;
      "
    >
      <div style="text-align: center; margin-bottom: 24px">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Chat_emoji_icon.png"
          alt="LinkLine Logo"
          style="max-width: 100px"
        />
      </div>

      <h2 style="color: #0a7bff; text-align: center; margin-bottom: 16px">
        Conta Criada com Sucesso
      </h2>

      <p style="color: #333333; text-align: center">
        Olá <strong th:text="${username}">Usuário</strong>,
      </p>

      <p style="color: #333333; text-align: center">
        Sua conta no <strong>LinkLine</strong> foi criada com sucesso!
      </p>

      <div style="text-align: center; margin: 24px 0">
        <a
          href="https://linkline.chat"
          style="
            font-size: 18px;
            font-weight: bold;
            background-color: #0a7bff;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
          "
        >
          Acessar LinkLine
        </a>
      </div>

      <p style="color: #333333; text-align: center">
        Se você tiver qualquer dúvida, estamos aqui para ajudar.
      </p>

      <hr style="margin: 32px 0; border: none; border-top: 1px solid #eee" />

      <p style="color: #333333; text-align: center">
        Bem-vindo(a) à LinkLine — a maneira mais fácil e rápida de se comunicar.
      </p>

      <p style="color: #333333; text-align: center">
        <strong>Equipe LinkLine</strong><br />
        <a
          href="https://linkline.chat"
          style="color: #005fcc; text-decoration: none"
          target="_blank"
          >linkline.chat</a
        >
      </p>
    </div>
  </body>
</html>
